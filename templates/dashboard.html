<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incubator Dashboard</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/graph.js"></script>
</head>
<body>

    <header>
        <h1>🐣 Incubator Dashboard</h1>
    </header>

    <section id="sensor-data">
        <h2>🌡 Live Sensor Data</h2>
        <p><strong>Temperature:</strong> <span id="temp">{{ temperature }}°F</span></p>
        <p><strong>Humidity:</strong> <span id="humidity">{{ humidity }}%</span></p>
    </section>

    <section id="charts">
        <h2>📈 Sensor Data Trends</h2>
        <canvas id="tempChart"></canvas>
        <canvas id="humidityChart"></canvas>
    </section>

    <section id="controls">
        <h2>🛠 Incubator Controls</h2>
        <button onclick="sendCommand('start')">Start Incubator</button>
        <button onclick="sendCommand('stop')">Stop Incubator</button>
        <button onclick="sendCommand('reset')">Reset System</button>
    </section>

    <section id="camera-feed">
        <h2>📷 Live Camera Feed</h2>
        <img src="/stream" alt="Incubator Camera Stream" width="480px">
    </section>

    <section id="settings-editor">
        <h2>⚙️ Edit Settings</h2>
        <form id="settings-form">
            <label>Temperature Target (°F):</label>
            <input type="number" id="temp_target" value="{{ settings['ADAPTIVE_CLIMATE_CONTROL']['TEMPERATURE_TARGET_FAHRENHEIT'] }}">
            
            <label>Humidity Target (%):</label>
            <input type="number" id="humidity_target" value="{{ settings['ADAPTIVE_CLIMATE_CONTROL']['HUMIDITY_TARGET_PERCENT'] }}">
            
            <label>Egg Turner Interval (min):</label>
            <input type="number" id="turner_interval" value="{{ settings['EGG_TURNER']['INTERVAL_MINUTES'] }}">
            
            <button type="button" onclick="updateSettings()">Save Changes</button>
        </form>
    </section>

    <script>
        function sendCommand(action) {
            $.get(`/api/command/${action}`, function(response) {
                alert(response.message);
            });
        }

        function updateSettings() {
            const newSettings = {
                "ADAPTIVE_CLIMATE_CONTROL": {
                    "TEMPERATURE_TARGET_FAHRENHEIT": parseFloat(document.getElementById("temp_target").value),
                    "HUMIDITY_TARGET_PERCENT": parseFloat(document.getElementById("humidity_target").value)
                },
                "EGG_TURNER": {
                    "INTERVAL_MINUTES": parseInt(document.getElementById("turner_interval").value)
                }
            };

            $.ajax({
                url: "/api/update-settings",
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify(newSettings),
                success: function(response) {
                    alert(response.message);
                    location.reload();
                },
                error: function(err) {
                    alert("Error updating settings: " + err.responseJSON.message);
                }
            });
        }
    </script>

</body>
</html>
